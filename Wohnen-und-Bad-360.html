<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blender-Ansichten (360°) · Wohnung</title>
<link rel="stylesheet" href="Projekt-Navigation.css?v=ansicht-1">
<style>
:root{font:16px/1.4 system-ui,sans-serif;color:#283b34;background:#f3f2eb}
*{box-sizing:border-box}
body{margin:0;padding:clamp(10px,1.6vw,32px);min-height:100dvh}
header{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:clamp(22px,2.4vw,43px);letter-spacing:-.04em;margin:0}
small{font-size:.85rem;color:#526459}
main{overflow:hidden;border-radius:14px;background:#fff;border:1px solid #d7dcd3;display:flex;flex-direction:column;height:calc(100dvh - 116px);min-height:390px}
nav{padding:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.group{display:flex;gap:5px}
.actions{margin-left:auto}
button,a.control{display:inline-flex;align-items:center;text-decoration:none;font:inherit;color:inherit;border:1px solid #d4ddd3;border-radius:7px;padding:.38em .66em;background:#f3f5ef;cursor:pointer}
button[aria-pressed="true"]{background:#38584b;color:#fff}
select{font:inherit;color:inherit;background:#f3f5ef;border:1px solid #d4ddd3;border-radius:7px;padding:.38em .5em}
button:focus-visible,canvas:focus-visible{outline:3px solid #bc934f;outline-offset:-3px}
.stage{position:relative;background:#3e4038;flex:1;min-height:0}
canvas,.fallback{display:block;width:100%;height:100%;touch-action:none}
canvas{cursor:grab}
canvas:active{cursor:grabbing}
.fallback{object-fit:contain}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;white-space:nowrap;background:#fbfcf7f2;border-color:#fff;box-shadow:0 2px 11px #17291f54;font-weight:650;font-size:clamp(12px,1.05vw,17px);padding:.5em .72em;border-radius:2em}
.hotspot:hover{background:#e4ecdf}
.hotspot span{margin-right:.3em}
[hidden]{display:none!important}
footer{font-size:.82rem;color:#53645a;padding:7px 12px}
main:fullscreen,main.expanded{height:100dvh;border:0;border-radius:0}
main.expanded{position:fixed;inset:0;z-index:10;width:100vw}
@media(max-width:620px){body{padding:8px}main{height:calc(100dvh - 90px)}nav{gap:5px;font-size:13px}.actions{margin-left:0}}
#blender-variant{font:inherit;color:inherit;background:#fafbf8;border:1px solid #cad6cb;border-radius:8px;padding:6px}
[data-base-options][hidden],#panorama-file[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Blender-Ansichten (360°)</h1><small id="render-state" role="status">Blender-Cycles</small></header>
<main>
<nav class="project-nav" aria-label="Seitennavigation"><a href="index.html" data-project="start">Startseite</a> <a href="Wohnen-und-Bad-360.html" data-project="blender" aria-current="page">Blender-Ansichten (360°)</a> <a href="Kueche-Wohnen-3D.html" data-project="model">3D-Konfigurator</a> <a href="Kueche-Wohnen-3D.html?modus=begehen" data-project="walk">Begehung</a> <a href="Kostenschaetzung.html" data-project="cost">Kostenschätzung</a></nav>
<nav aria-label="Panorama einstellen">
<div class="group" aria-label="Raum"><button data-room="wohn">Stube</button><button data-room="essen">Essplatz</button><button data-room="kueche">Küche</button><button data-room="flur">Flur</button><button data-room="bad">Bad</button></div>
<div class="group"><label>Blender-Variante <select id="blender-variant">
<option value="bisher">Bisheriger Entwurf</option>
<option value="taubenblau-2" data-walk>Taubenblau · Stein · Nebelblau 2</option>
</select></label></div>
<div class="view-mode" role="group" aria-label="Ansichtsmodus">
 <span aria-current="page">360°-Ansicht</span>
 <a id="blender-walk" href="Begehung-Taubenblau-2/" hidden>Frei begehen</a>
 <span id="blender-walk-unavailable" aria-disabled="true" title="Für diesen Entwurf liegt nur das Panorama vor.">Frei begehen</span>
</div>
<div class="group" aria-label="Decke" data-base-options><button data-finish="holz">Holzdecke</button><button data-finish="weiss">Warmweisse Decke</button></div>
<div class="group" aria-label="Küchenboden" data-base-options><button data-floor="schiefer">Schiefer</button><button data-floor="parkett">Eichenparkett</button></div>
<div class="group" aria-label="Badboden" data-base-options><button data-bathfloor="neu">Bad neu</button><button data-bathfloor="bestand">Bad Bestand</button></div>
<div class="group actions"><a class="control" id="panorama-file" hidden target="_blank" rel="noopener">4K-Panorama öffnen</a><button id="reset">Startblick</button><button id="expand" aria-pressed="false">Vollbild</button></div>
</nav>
<div class="stage">
<canvas tabindex="0" aria-label="360-Grad-Ansicht. Mit Pfeiltasten drehen und mit Plus oder Minus zoomen."></canvas>
<div class="hotspots" aria-label="Wege zu benachbarten Standpunkten"></div>
<img hidden class="fallback" alt="Equirektangulares 360-Grad-Panorama">
</div>
<footer id="hint">Markierungen anklicken, um weiterzugehen · Ziehen zum Umschauen · Scrollen zum Zoomen</footer>
</main>
<script>
const images={"wohn-holz-schiefer":"cycles-4k-wohn-holz-schiefer.jpg","wohn-holz-parkett":"cycles-4k-wohn-holz-parkett.jpg","wohn-weiss-schiefer":"cycles-hd-wohn-weiss-schiefer.jpg","wohn-weiss-parkett":"cycles-hd-wohn-weiss-parkett.jpg","essen-holz-schiefer":"cycles-4k-essen-holz-schiefer.jpg","essen-holz-parkett":"cycles-4k-essen-holz-parkett.jpg","essen-weiss-schiefer":"cycles-hd-essen-weiss-schiefer.jpg","essen-weiss-parkett":"cycles-hd-essen-weiss-parkett.jpg","kueche-holz-schiefer":"cycles-4k-kueche-holz-schiefer.jpg","kueche-holz-parkett":"cycles-4k-kueche-holz-parkett.jpg","kueche-weiss-schiefer":"cycles-hd-kueche-weiss-schiefer.jpg","kueche-weiss-parkett":"cycles-hd-kueche-weiss-parkett.jpg","flur-holz-schiefer":"cycles-4k-flur-holz-schiefer.jpg","flur-holz-parkett":"cycles-4k-flur-holz-parkett.jpg","flur-weiss-schiefer":"cycles-hd-flur-weiss-schiefer.jpg","flur-weiss-parkett":"cycles-hd-flur-weiss-parkett.jpg","bad-holz-parkett":"cycles-4k-bad-holz-parkett.jpg","bad-holz-bestand":"cycles-hd-bad-holz-bestand.jpg","bad-holz-schiefer":"cycles-4k-bad-holz-parkett.jpg","bad-weiss-parkett":"cycles-hd-bad-weiss-parkett.jpg","bad-weiss-bestand":"cycles-hd-bad-weiss-bestand.jpg","bad-weiss-schiefer":"cycles-hd-bad-weiss-parkett.jpg"};
const currentImages={"wohn-holz-schiefer":true,"wohn-holz-parkett":true,"essen-holz-schiefer":true,"essen-holz-parkett":true,"kueche-holz-schiefer":true,"kueche-holz-parkett":true,"flur-holz-schiefer":true,"flur-holz-parkett":true,"bad-holz-parkett":true,"bad-holz-schiefer":true};
const main=document.querySelector('main'),canvas=document.querySelector('canvas');
const fallback=document.querySelector('.fallback');
const gl=canvas.getContext('webgl',{alpha:false,antialias:false});
const starts={wohn:[-1.01,-.13],essen:[-2.30,-.13],kueche:[3.11,-.21],flur:[-1.26,-.12],bad:[.49,-.39]};
const positions={wohn:[5.42,6.20],essen:[7.78,4.80],kueche:[7.92,2.92],flur:[4.84,2.85],bad:[5.69,.77]};
const routes={
 wohn:[['essen',7.53,4.85,.79],['flur',4.86,4.20,.83]],
 essen:[['wohn',5.53,6.19,.72],['kueche',7.93,3.97,.79]],
 kueche:[['essen',7.90,4.23,.78]],
 flur:[['wohn',4.86,4.24,.78],['bad',5.43,.60,.91]],
 bad:[['flur',5.35,.62,.81]]
};
const hotspots=document.querySelector('.hotspots');
const variantMenu=document.querySelector('#blender-variant');
const variantIds=new Set([...variantMenu.options].map(option=>option.value));
const initialVariant=new URLSearchParams(location.search).get('variante');
let variant=variantIds.has(initialVariant)?initialVariant:'bisher';
variantMenu.value=variant;
let markers=[],loaded=false;
function makeMarkers(){
 const names=Object.fromEntries([...document.querySelectorAll('[data-room]')].map(b=>[b.dataset.room,b.textContent]));
 markers=routes[room].map(([next,x,y,z])=>{
   const button=document.createElement('button');
   button.type='button';button.className='hotspot';button.hidden=true;
   button.textContent='➜ '+names[next];
   button.setAttribute('aria-label','Weiter nach '+names[next]);
   const [px,py]=positions[room];
   const direction=[x-px,y-py,z-1.48];
   button.onclick=()=>select(next,finish,Math.atan2(direction[1],direction[0]));
   return {button,direction};
 });
 hotspots.replaceChildren(...markers.map(m=>m.button));
}
function projectMarkers(width,height,scale){
 const a=Math.cos(yaw),b=Math.sin(yaw),c=Math.cos(pitch),d=Math.sin(pitch);
 for(const {button,direction:[x,y,z]} of markers){
   const ahead=x*a*c+y*b*c+z*d;
   const u=(-x*b+y*a)/(ahead*scale);
   const v=(-x*a*d-y*b*d+z*c)/(ahead*scale*height/width);
   button.hidden=!loaded||ahead<=0||Math.abs(u)>.87||Math.abs(v)>.88;
   if(!button.hidden){
     button.style.left=(50+u*50)+'%';
     button.style.top=(50-v*50)+'%';
   }
 }
}
const maxFov=1.93;
let room='wohn',finish='holz',floor='schiefer',bathFloor='neu',[yaw,pitch]=starts[room],fov=maxFov,texture,bathMask,uniforms,last,revision=0;
function draw(){
 if(!gl||!texture)return;
 const ratio=Math.min(window.devicePixelRatio||1,2);
 const w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);
 if(!w||!h)return;
 if(w!==canvas.width||h!==canvas.height){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);
 gl.uniform2f(uniforms.camera,yaw,pitch);
 const width=Math.tan(fov/2);
 gl.uniform2f(uniforms.scale,width,width*h/w);
 const stockKey='bad-'+finish+'-bestand';
 gl.uniform1i(uniforms.showBlue,Number(variant==='bisher'&&room==='bad'&&bathFloor==='bestand'&&!currentImages[stockKey]&&canPreviewStock()));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 projectMarkers(w,h,width);
}
function reset(){
 [yaw,pitch]=starts[room];fov=maxFov;draw();
}
// Stock-floor preview for the matching 4K bath camera. The rest of the
// scene is sampled directly from the same Cycles panorama.
function canPreviewStock(){
 return !!gl&&finish==='holz'&&currentImages['bad-holz-parkett'];
}
function hasStockRender(){
 return Boolean(images['bad-'+finish+'-bestand'])&&(!canPreviewStock()||Boolean(currentImages['bad-'+finish+'-bestand']));
}
function select(next,material,heading){
 const moved=next!==room;
 if(moved){
   room=next;
   [yaw,pitch]=starts[room];
   if(heading!==undefined)yaw=heading;
   fov=maxFov;
 }
 loaded=false;
 if(moved||!markers.length)makeMarkers();
 for(const {button} of markers)button.hidden=true;
 finish=material;
 if(variant!=='bisher'){
   const shareUrl=new URL(location.href);
   shareUrl.searchParams.set('variante',variant);
   shareUrl.searchParams.set('room',room);
   history.replaceState(null,'',shareUrl);
 }
 const bathPair=hasStockRender()||canPreviewStock();
 if(!bathPair&&bathFloor==='bestand')bathFloor='neu';
 document.querySelector('[data-bathfloor="bestand"]').textContent=bathPair?'Bad Bestand':'Bestandsboden live';
 document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.room===room));
 document.querySelectorAll('[data-finish]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.finish===finish));
 document.querySelectorAll('[data-floor]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.floor===floor));
 document.querySelectorAll('[data-bathfloor]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bathfloor===bathFloor));
 document.querySelectorAll('[data-project="walk"]').forEach(link=>{link.href='Kueche-Wohnen-3D.html?modus=begehen&raum='+room;});
 const blenderWalk=document.querySelector('#blender-walk');
 const available=variantMenu.selectedOptions[0].hasAttribute('data-walk');
 blenderWalk.hidden=!available;
 document.querySelector('#blender-walk-unavailable').hidden=available;
 if(available)blenderWalk.href='Begehung-Taubenblau-2/?'+new URLSearchParams({variante:variant,raum:room});
 const stock=room==='bad'&&bathFloor==='bestand';
 const key=stock&&hasStockRender()?'bad-'+finish+'-bestand':room+'-'+finish+'-'+floor;
 document.querySelectorAll('[data-base-options]').forEach(group=>{group.hidden=variant!=='bisher';});
 const url=variant==='bisher'?images[key]:`Varianten/${variant}/${room}.jpg`;
 const panoramaFile=document.querySelector('#panorama-file');
 panoramaFile.hidden=variant==='bisher';
 panoramaFile.href=url;
 const current=++revision;
 const badge=document.querySelector('#render-state');
 const status=variant!=='bisher'?variantMenu.selectedOptions[0].textContent+' · Blender-Cycles · 4K':stock&&!hasStockRender()?'Blender-Cycles · 4K · blaue Fliesen als Vorschau':
   currentImages[key]?'Blender-Cycles · aktueller Entwurf · 4K':'Blender-Cycles · früherer Entwurfsstand';
 badge.textContent='Panorama lädt …';
 if(!gl){fallback.src=url;badge.textContent=status;return;}
 const pic=new Image();
 pic.onload=()=>{
   if(current!==revision)return;
   gl.activeTexture(gl.TEXTURE0);
   gl.bindTexture(gl.TEXTURE_2D,texture);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,pic);
   badge.textContent=status;loaded=true;draw();
 };
 pic.onerror=()=>{if(current===revision)badge.textContent='Panorama konnte nicht geladen werden';};
 pic.src=url;
}
if(gl){
 const p=gl.createProgram();
 for(const [type,code] of [[gl.VERTEX_SHADER,`
 attribute vec2 position;
 varying vec2 screen;
 void main(){screen=position;gl_Position=vec4(position,0.,1.);}
 `],[gl.FRAGMENT_SHADER,`
 precision highp float;
 varying vec2 screen;
 uniform vec2 camera,scale;
 uniform sampler2D image,bathMask;
 uniform bool showBlue;
 float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float noise(vec2 p){
   vec2 i=floor(p),f=smoothstep(0.,1.,fract(p));
   return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),
              mix(hash(i+vec2(0.,1.)),hash(i+1.),f.x),f.y);
 }
 const float pi=3.14159265359;
 void main(){
   float a=camera.x, b=camera.y;
   vec3 f=vec3(cos(a)*cos(b),sin(a)*cos(b),sin(b));
   vec3 r=vec3(-sin(a),cos(a),0.);
   vec3 u=vec3(-cos(a)*sin(b),-sin(a)*sin(b),cos(b));
   vec3 d=normalize(f+r*screen.x*scale.x+u*screen.y*scale.y);
   vec2 pos=vec2(fract(atan(d.y,d.x)/(2.*pi)+.5),.5-asin(clamp(d.z,-1.,1.))/pi);
   vec3 base=texture2D(image,pos).rgb;
   if(showBlue&&d.z<-.12){
     float mask=texture2D(bathMask,pos).r;
     if(mask>0.){
       vec2 tile=(vec2(5.69,.77)+d.xy*(1.455/-d.z)-vec2(5.4,.19))/.30;
       float shade=dot(base,vec3(.26,.62,.12));
       float cloud=(noise(tile*4.)-.5)*.16+(noise(tile*12.)-.5)*.07;
       float variation=(hash(floor(tile))-.5)*.13;
       float edge=min(min(fract(tile.x),1.-fract(tile.x)),min(fract(tile.y),1.-fract(tile.y)));
       float joint=1.-smoothstep(.004,.015,edge);
       vec3 blue=shade*vec3(.46,.52,.65)*(1.+cloud+variation);
       base=mix(base,mix(blue,shade*vec3(.60,.61,.64),joint*.78),mask);
     }
   }
   gl_FragColor=vec4(base,1.);
 }
 `]]){
  const shader=gl.createShader(type);gl.shaderSource(shader,code);gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
  gl.attachShader(p,shader);
 }
 gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
 gl.useProgram(p);
 uniforms=Object.fromEntries(['camera','scale','image','bathMask','showBlue'].map(name=>[name,gl.getUniformLocation(p,name)]));
 gl.uniform1i(uniforms.image,0);
 gl.uniform1i(uniforms.bathMask,1);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const location=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(location);
 gl.vertexAttribPointer(location,2,gl.FLOAT,false,0,0);
 texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
 for(const key of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,key,gl.CLAMP_TO_EDGE);
 for(const key of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,key,gl.LINEAR);
 const matte=document.createElement('canvas');
 matte.width=1400;matte.height=700;
 const paint=matte.getContext('2d');
 paint.fillStyle='#000';paint.fillRect(0,0,1400,700);
 paint.fillStyle='#fff';
 const outline=new Path2D('M0 655 Q134 662 243 615 Q370 622 511 595 L529 594 L595 554 Q603 550 605 542 L605 530 Q618 516 632 496 Q664 503 731 502 Q731 523 747 533 Q756 537 775 534 L771 563 L768 595 Q775 622 854 644 Q927 662 972 661 Q997 659 1008 635 L1022 602 Q1084 604 1138 596 Q1186 644 1270 652 Q1330 663 1400 657 L1400 700 L0 700Z');
 paint.fill(outline);
 bathMask=gl.createTexture();
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D,bathMask);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,matte);
 for(const key of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,key,gl.CLAMP_TO_EDGE);
 for(const key of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,key,gl.LINEAR);
 gl.activeTexture(gl.TEXTURE0);
 new ResizeObserver(draw).observe(canvas);
}else{
 canvas.hidden=true;fallback.hidden=false;
 document.querySelector('#hint').textContent='Panorama-Vorschau · Standpunkte oben auswählbar · Interaktives Umschauen benötigt WebGL.';
}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>select(b.dataset.room,finish));
document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>select(room,b.dataset.finish));
document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{floor=b.dataset.floor;select(room,finish);});
document.querySelectorAll('[data-bathfloor]').forEach(b=>b.onclick=()=>{
 bathFloor=b.dataset.bathfloor;
 select('bad',finish);
});
document.querySelector('#reset').onclick=reset;
const expand=document.querySelector('#expand');
function fullLabel(){
 const open=!!document.fullscreenElement||main.classList.contains('expanded');
 expand.textContent=open?'Vollbild beenden':'Vollbild';
 expand.setAttribute('aria-pressed',open);
}
expand.onclick=async()=>{
 if(document.fullscreenElement){await document.exitFullscreen();return;}
 if(main.classList.contains('expanded'))main.classList.remove('expanded');
 else if(main.requestFullscreen){
   try{await main.requestFullscreen();}catch{main.classList.add('expanded');}
 }else main.classList.add('expanded');
 fullLabel();
};
document.addEventListener('fullscreenchange',fullLabel);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){main.classList.remove('expanded');fullLabel();}});
const clampPitch=()=>{pitch=Math.max(-1.55,Math.min(1.55,pitch));};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY];};
canvas.onpointermove=e=>{
 if(!last)return;
 yaw-=(e.clientX-last[0])*fov/Math.max(180,canvas.clientWidth);
 pitch+=(e.clientY-last[1])*fov/Math.max(180,canvas.clientWidth);
 clampPitch();last=[e.clientX,e.clientY];draw();
};
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{last=null;});
function zoom(value){fov=Math.max(.42,Math.min(maxFov,fov*value));draw();}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(Math.sign(e.deltaY)*.09));},{passive:false});
canvas.addEventListener('keydown',e=>{
 switch(e.key){
 case 'ArrowLeft':yaw-=.11;break;
 case 'ArrowRight':yaw+=.11;break;
 case 'ArrowUp':pitch+=.10;break;
 case 'ArrowDown':pitch-=.10;break;
 case '+':zoom(.90);break;
 case '-':zoom(1.11);break;
 default:return;
 }
 e.preventDefault();clampPitch();draw();
});
variantMenu.addEventListener('change',()=>{
 variant=variantMenu.value;
 const url=new URL(location.href);
 if(variant==='bisher')url.searchParams.delete('variante');
 else url.searchParams.set('variante',variant);
 url.searchParams.set('room',room);
 history.replaceState(null,'',url);
 select(room,finish);
});
const initialRoom=new URLSearchParams(location.search).get('room');
select(Object.hasOwn(starts,initialRoom)?initialRoom:room,finish);
</script>
</body>
</html>
